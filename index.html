<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <title>AIMBRACE - compose apps from plugins, let the graph do the rest</title>
    <meta name="description" content="AIMBRACE is a TypeScript application composition runtime built on Cordis: a typed plugin graph, deterministic lifecycle, scopes for every task, and one plugin contract for many hosts." />
    <meta property="og:title" content="AIMBRACE" />
    <meta property="og:description" content="A TypeScript application composition runtime built on Cordis." />
    <meta property="og:image" content="https://aimbrace.github.io/logo.png" />
    <script>
      // Applied before paint so a reload or page switch never flashes the wrong theme (the toggle writes the same key).
      (function () {
        try {
          var stored = localStorage.getItem('aimbrace-theme')
          var dark = stored === 'dark' || (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
